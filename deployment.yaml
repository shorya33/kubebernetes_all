apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-hello-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-hello
  template:
    metadata:
      labels:
        app: go-hello
    spec:
      containers:
      - name: go-app
        image: shorya1853/go-app:1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
